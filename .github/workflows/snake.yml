name: ⚡ Generate Cyber Contribution Snake

on:
  # Schedule daily generation at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  
  # Allows manual triggers from GitHub Actions tab
  workflow_dispatch:
  
  # Runs on pushes to main branch
  push:
    branches:
      - main

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🐍 Generate Snake SVG Animations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🎨 Generate Custom Snake Animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161b22,#0c4a6e,#0284c7,#38bdf8,#7dd3fc
            dist/github-snake-cyber.svg?color_snake=#00f2fe&color_dots=#0b0f19,#1e1b4b,#4338ca,#6366f1,#38bdf8

      - name: 🚀 Deploy SVG Assets to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(snake): update cyber contribution graph animations [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
